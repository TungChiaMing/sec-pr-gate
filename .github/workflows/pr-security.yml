# sec-pr-gate 自己的 caller（v4）。邏輯全部搬進 scan.yml，這裡只剩 12 行。
# 同 repo 用相對路徑 ./ ，會跟著本 commit 走（不需要 pin SHA）。
name: pr-security

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  security:
    # zizmor 建議改用 $/ 的 self-repository 語法，但 actionlint 1.7.10 會判定格式錯誤
    # （官方文件目前也只寫 ./path 與 owner/repo/path@ref 兩種）。兩者相衝時選官方文件。
    uses: ./.github/workflows/scan.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
      pull-requests: write
    with:
      severity_threshold: HIGH
      fail_on: new
