# 把同一個 image 直接拿到 GitHub Actions 用 —— 本機跟 CI 跑的是同一份東西
name: sec-pr-gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build scanner image
        run: docker build -t sec-pr-gate:latest .

      - name: Run gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p reports
          docker run --rm \
            -e GH_TOKEN -e GH_REPO \
            -e FAIL_ON_SEMGREP=ERROR \
            -e FAIL_ON_TRIVY=HIGH,CRITICAL \
            -v "$PWD:/src" \
            -v "$PWD/reports:/out" \
            sec-pr-gate:latest pr-gate ${{ github.event.pull_request.number }}

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/

      - name: Upload raw reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sec-pr-gate-reports
          path: reports/
